<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do atendente · ETECC</title>
<style>
  :root{--brand:#e30613;--ink:#1a1a1a;--soft:#5a5b5e;--border:#e6e6e8;--alt:#f5f5f5}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--alt);height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,#e30613,#a80812);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  header strong{font-size:17px}header small{opacity:.85}
  main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
  aside{border-right:1px solid var(--border);background:#fff;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
  .item{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;font:inherit}
  .item.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(227,6,19,.15)}
  .item strong{display:block;font-size:14px}.item small{color:var(--soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--alt);color:var(--soft);margin-bottom:4px}
  .fila .badge{background:#fee2e2;color:#b91c1c}.humano .badge{background:#dbeafe;color:#1d4ed8}.ia .badge{background:#dcfce7;color:#15803d}
  section{display:flex;flex-direction:column;min-height:0}
  .vazio{color:var(--soft);padding:30px;text-align:center}
  .info{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;font-size:14px}
  .info b{color:var(--brand)}
  .log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:70%;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--border);white-space:pre-wrap}
  .msg.cliente{align-self:flex-end;background:var(--brand);color:#fff;border:0}
  .msg.atendente{background:#dbeafe;border-color:#bfdbfe}
  .msg.sistema{align-self:center;background:transparent;border:0;color:var(--soft);font-size:13px;text-align:center}
  .msg small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin-bottom:2px}
  form{display:flex;gap:8px;padding:12px 20px;background:#fff;border-top:1px solid var(--border)}
  textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font:inherit;resize:none;height:64px}
  button.acao{border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  button.acao.sec{background:var(--alt);color:var(--ink)}
  button:disabled{opacity:.5;cursor:not-allowed}
  @media (max-width:800px){main{grid-template-columns:1fr}aside{max-height:35vh}}
</style>
</head>
<body>
<header><strong>ETECC · Painel do atendente</strong><small>Protótipo: as conversas chegam aqui quando a IA encaminha ou fica indisponível</small></header>
<main>
  <aside id="lista"><p class="vazio">Nenhum atendimento ainda</p></aside>
  <section id="detalhe"><p class="vazio">Selecione um atendimento na lista</p></section>
</main>
<script type="module">
const LABEL = { ia: "Com a IA", fila: "Aguardando atendente", humano: "Em atendimento", encerrado: "Encerrado" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (s) => document.querySelector(s);
let atual = null, vistos = 0;

async function lista() {
  const ss = await fetch("/api/sessoes").then((r) => r.json());
  const peso = { fila: 0, humano: 1, ia: 2, encerrado: 3 };
  ss.sort((a, b) => peso[a.status] - peso[b.status] || b.criado.localeCompare(a.criado));
  $("#lista").innerHTML = ss.map((s) => `<button class="item ${s.status} ${s.id === atual ? "sel" : ""}" data-id="${s.id}"><span class="badge">${LABEL[s.status]}</span><strong>${s.modo === "suporte" ? "Suporte" : "Vendas"} · ${s.id} · ${new Date(s.criado).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</strong><small>${esc(s.motivo || s.ultima || "")}</small></button>`).join("") || '<p class="vazio">Nenhum atendimento ainda</p>';
}

function abrir(id) {
  atual = id; vistos = 0;
  $("#detalhe").innerHTML = `<div class="info"></div><div class="log"></div>
    <form><textarea placeholder="Responder ao cliente..."></textarea><button class="acao" type="submit">Responder</button><button class="acao sec" type="button" id="encerrar">Encerrar</button></form>`;
  $("#detalhe form").onsubmit = async (e) => {
    e.preventDefault();
    const ta = $("#detalhe textarea"), texto = ta.value.trim();
    if (!texto) return;
    ta.value = "";
    await fetch(`/api/sessoes/${atual}/atendente`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ texto }) });
    detalhe(); lista();
  };
  $("#encerrar").onclick = async () => { await fetch(`/api/sessoes/${atual}/encerrar`, { method: "POST" }); detalhe(); lista(); };
  detalhe();
}

async function detalhe() {
  if (!atual) return;
  const s = await fetch(`/api/sessoes/${atual}?since=${vistos}`).then((r) => r.json());
  $("#detalhe .info").innerHTML = `<b>${LABEL[s.status]}</b> · ${s.modo === "suporte" ? "Suporte" : "Vendas"}${s.motivo ? ` · <b>Motivo:</b> ${esc(s.motivo)}` : ""}${s.resumo ? `<br><b>Resumo da IA:</b> ${esc(s.resumo)}` : ""}${s.perfil?.plano ? `<br><b>Quiz:</b> ${esc(JSON.stringify(s.perfil))}` : ""}`;
  const log = $("#detalhe .log");
  for (const e of s.entries) {
    const d = document.createElement("div");
    d.className = "msg " + e.de;
    d.innerHTML = (e.de === "ia" ? "<small>IA</small>" : e.de === "atendente" ? "<small>Você</small>" : "") + esc(e.texto || `${e.tipo === "pedido" ? "Pedido" : "Chamado"} ${e.protocolo}: ${e.plano || e.descricao || ""}`);
    log.append(d);
  }
  if (s.entries.length) log.scrollTop = log.scrollHeight;
  vistos = s.total;
  $("#detalhe textarea").disabled = $("#detalhe form button").disabled = s.status === "encerrado";
}

$("#lista").onclick = (e) => { const b = e.target.closest("[data-id]"); if (b && b.dataset.id !== atual) { abrir(b.dataset.id); lista(); } };
setInterval(() => { lista(); detalhe(); }, 3000);
lista();
</script>
</body>
</html>
